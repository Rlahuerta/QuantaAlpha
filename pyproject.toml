[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools",
  "setuptools-scm",
]

[project]
authors = [
  {email = "tangzy27@mail2.sysu.edu.cn", name = "Ziyi Tang"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
description = "QuantaAlpha - LLM-Driven Alpha Factor Mining Agent"
dynamic = [
  "dependencies",
  "optional-dependencies",
  "version",
]
keywords = [
  "Quantitative Finance",
  "Factor Mining",
  "Large Language Models",
  "Autonomous Agents",
]
name = "quantaalpha"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
quantaalpha = "quantaalpha.cli:app"

[project.urls]
homepage = "https://github.com/QuantaAlpha/quantaalpha"
issue = "https://github.com/QuantaAlpha/quantaalpha/issues"

[tool.setuptools]
packages = {find = {where = ["."], exclude = ["data*", "hf_data*", "git_ignore_folder*", "mlruns*", "workspace*", "pickle_cache*", "frontend-v2*", "home*", "log*", "scripts*", "tests*", "docs*", "configs*"]}}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
docs = {file = ["requirements/docs.txt"]}

[tool.setuptools_scm]
local_scheme = "no-local-version"
version_scheme = "guess-next-dev"

# ── Coverage ────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["quantaalpha"]
omit = [
  "quantaalpha/scenarios/*",
  "quantaalpha/app/*",
  "*/test_*.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "pass",
]
# Per-module minimum thresholds enforced by tests/coverage_gate.py
fail_under = 20

# ── Ruff (linter + formatter) ──────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120
src = ["quantaalpha", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "RUF",    # ruff-specific rules
]
ignore = [
  "E501",   # line too long — handled by formatter
  "E741",   # ambiguous variable name (common in math: l, I, O)
  "F401",   # unused imports — clean up incrementally
  "F841",   # unused variable — clean up incrementally
  "B905",   # zip strict — not needed in data pipelines
  "SIM108", # ternary operator — readability preference
  "SIM110", # reimplemented builtin — false positives on generators
  "SIM114", # combinable if — readability preference
  "SIM117", # multiple with — readability preference
  "RUF001", # ambiguous unicode — common in Chinese market data
  "RUF002", # ambiguous unicode docstring
  "RUF003", # ambiguous unicode comment
  "UP007",  # X | Y union — keep Optional[] for 3.10 compat
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "RUF"]
"quantaalpha/factors/coder/function_lib.py" = ["E", "W"]  # generated operator code
"quantaalpha/scenarios/*" = ["F401"]  # re-export modules

[tool.ruff.lint.isort]
known-first-party = ["quantaalpha"]

# ── Mypy (type checker) ────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
# Start lenient — tighten over time
disallow_untyped_defs = false
exclude = [
  "quantaalpha/scenarios/",
  "tests/",
  "scripts/",
  "docs/",
]
