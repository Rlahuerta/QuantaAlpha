######################################################################
# Backtest V2 — US Equities configuration
# Data: yfinance EOD OHLCV (S&P 500 + NASDAQ-100, 517 tickers, 2016-2026)
#       stored in git_ignore_folder/factor_implementation_source_data_us/daily_pv.h5
# Factor source: US-mined decay-filtered library (all_factors_library_exp_us_decay5d.json)
# Model: LightGBM  |  Strategy: TopkDropout (topk=30, n_drop=2)
# Benchmark: SPY (from git_ignore_folder/parquet_us/benchmark_gspc.parquet)
######################################################################

random_seed: 42

experiment:
  name: "us_backtest"
  recorder: "us_recorder"
  output_dir: "data/results/backtest_v2_results"
  output_metrics_file: "backtest_metrics.json"
  model_save_dir: "data/models"   # trained LightGBM saved here for Phase 2 signal generation

######################################################################
# 1. Factor source
######################################################################

factor_source:
  type: "custom"

  custom:
    json_files: []
    quality_filter: null
    max_factors: null
    use_llm_for_incompatible: false

  combined:
    official_source: "alpha158_20"
    include_custom: true

######################################################################
# 2. Data and market
######################################################################

data:
  # Qlib CN data is used only to initialise the framework (LGBModel, risk_analysis, R.start).
  # All US factor computation and label computation use the H5/parquet paths below.
  provider_uri: "~/.qlib/qlib_data/cn_data"
  region: "cn"
  market: "sp500"           # Unknown to CN Qlib → no CSI300 instrument filtering applied
  start_time: "2016-01-01"
  end_time:   "2025-12-31"

  # Parquet bundle for US portfolio backtest fallback and label computation.
  # Files: sp500_prices.parquet, benchmark_gspc.parquet
  parquet_bundle_dir: "git_ignore_folder/parquet_us"

######################################################################
# 3. Dataset and preprocessing
######################################################################

dataset:
  # Multi-period label: 50% 1-day + 30% 5-day + 20% 20-day forward return.
  # Blending horizons reduces label noise while preserving short-term alpha.
  # When parquet_bundle_dir is set, _compute_label() parses this expression
  # directly from the Ref($close,-N) terms — no Qlib D.features() call needed.
  label: "(Ref($close, -2) / Ref($close, -1) - 1) * 0.5 + (Ref($close, -6) / Ref($close, -1) - 1) * 0.3 + (Ref($close, -21) / Ref($close, -1) - 1) * 0.2"

  learn_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "DropnaLabel"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "label"

  infer_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "label"

  segments:
    train: ["2016-01-01", "2020-12-31"]
    valid: ["2021-01-01", "2021-12-31"]
    test:  ["2022-01-01", "2025-12-31"]

######################################################################
# 4. Model
######################################################################

model:
  type: "lgb"
  extended_training: true
  params:
    loss: "mse"
    learning_rate: 0.1
    max_depth: 8
    num_leaves: 210
    colsample_bytree: 0.8879
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    num_threads: 20
    seed: 42
    random_state: 42
    early_stopping_round: 50
    num_boost_round: 500
    min_child_samples: 100
    feature_fraction_bynode: 0.8

######################################################################
# 5. Backtest and portfolio
######################################################################

backtest:
  strategy:
    class: "TopkDropoutStrategy"
    module_path: "qlib.contrib.strategy"
    kwargs:
      signal: "<PRED>"
      topk: 30
      n_drop: 2
    rebalance_freq: 1

  backtest:
    start_time: "2022-01-01"
    end_time:   "2025-12-31"
    account: 1000000           # $1 M paper capital
    benchmark: "SPY"           # Used by parquet portfolio metrics path
    exchange_kwargs:
      limit_threshold: null    # No circuit breakers in US markets
      deal_price: "open"
      open_cost:  0.001        # 0.10% round-trip (US brokerage + market impact)
      close_cost: 0.001
      min_cost: 1

######################################################################
# 6. LLM (for custom factor computation)
######################################################################

max_memory_gb: 40

factor_precision: float16

llm:
  enabled: false
  timeout: 300
  max_retries: 3
  cache_results: true
  # US-specific cache dir — separate from CN to avoid expression hash collisions
  cache_dir: "data/results/factor_cache_us"
  auto_extract_cache: false
  debug: false

######################################################################
# 7. Factor calculation
######################################################################

factor_calculation:
  output_dir: "data/results/computed_factors"
  save_intermediate: true
  n_jobs: 4
  # US OHLCV data — bypasses Qlib D.features() for factor computation
  data_file: "git_ignore_folder/factor_implementation_source_data_us/daily_pv.h5"
