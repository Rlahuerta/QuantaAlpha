######################################################################
# Backtest V2 — US S&P 500 Paper Reproduction Config
# Matches paper Table 7 parameters exactly:
#   topk=50, n_drop=5, single-day label, 0.05%/0.15% costs
#   Benchmark: SPX
# Paper approach: zero-shot CN→US factor transfer
######################################################################

random_seed: 42

experiment:
  name: "us_paper_repro"
  recorder: "us_paper_recorder"
  output_dir: "data/results/backtest_v2_results"
  output_metrics_file: "backtest_metrics.json"
  model_save_dir: "data/models"

######################################################################
# 1. Factor source
######################################################################

factor_source:
  type: "combined"

  custom:
    json_files: []
    quality_filter: null
    max_factors: null
    use_llm_for_incompatible: false

  combined:
    official_source: "alpha158_20"
    include_custom: true

######################################################################
# 2. Data and market
######################################################################

data:
  provider_uri: "~/.qlib/qlib_data/cn_data"
  region: "cn"
  market: "sp500"
  start_time: "2016-01-01"
  end_time:   "2025-12-26"

  parquet_bundle_dir: "git_ignore_folder/parquet_us"

######################################################################
# 3. Dataset and preprocessing (Paper: single-day label, CSRankNorm)
######################################################################

dataset:
  # Paper label: next-day return (single period)
  label: "Ref($close, -2) / Ref($close, -1) - 1"

  learn_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "DropnaLabel"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "label"

  infer_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "label"

  segments:
    train: ["2016-01-01", "2020-12-31"]
    valid: ["2021-01-01", "2021-12-31"]
    test:  ["2022-01-01", "2025-12-26"]

######################################################################
# 4. Model (same LightGBM params as paper)
######################################################################

model:
  type: "lgb"
  extended_training: true
  params:
    loss: "mse"
    learning_rate: 0.1
    max_depth: 8
    num_leaves: 210
    colsample_bytree: 0.8879
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    num_threads: 20
    seed: 42
    random_state: 42
    early_stopping_round: 50
    num_boost_round: 500
    min_child_samples: 100
    feature_fraction_bynode: 0.8

######################################################################
# 5. Backtest and portfolio (Paper Table 7 exact params)
######################################################################

backtest:
  strategy:
    class: "TopkDropoutStrategy"
    module_path: "qlib.contrib.strategy"
    kwargs:
      signal: "<PRED>"
      topk: 50
      n_drop: 5
    rebalance_freq: 1

  backtest:
    start_time: "2022-01-01"
    end_time:   "2025-12-26"
    account: 1000000
    benchmark: "SPY"
    exchange_kwargs:
      limit_threshold: 0.095    # Paper uses 9.5% limit (Table 7)
      deal_price: "open"
      open_cost:  0.0005        # 0.05% buying fee (paper Table 7)
      close_cost: 0.0015        # 0.15% selling fee (paper Table 7)
      min_cost: 1

######################################################################
# 6. LLM
######################################################################

max_memory_gb: 40

factor_precision: float16

llm:
  enabled: false
  timeout: 300
  max_retries: 3
  cache_results: true
  cache_dir: "data/results/factor_cache_us"
  auto_extract_cache: false
  debug: false

######################################################################
# 7. Factor calculation
######################################################################

factor_calculation:
  output_dir: "data/results/computed_factors"
  save_intermediate: true
  n_jobs: 4
  data_file: "git_ignore_folder/factor_implementation_source_data_us/daily_pv.h5"
