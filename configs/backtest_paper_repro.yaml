######################################################################
# Paper Reproduction Backtest Configuration
# Reproduces Table 1 of arXiv:2602.07085v1 (QuantaAlpha paper)
#
# Key settings from paper:
#   - CSI 300, train 2016-2020, valid 2021, test 2022-2025
#   - Label: next-day return y_t = P^close_{t+2} / P^close_{t+1} - 1
#   - TopkDropout: topk=50, n_drop=5
#   - Costs: buy 0.05%, sell 0.15%
#   - Benchmark: SH000300
#   - CSRankNorm on features AND labels
#   - LightGBM with Qlib defaults
#   - Combined factors: mined + Alpha158(20)
######################################################################

random_seed: 42

experiment:
  name: "paper_reproduction"
  recorder: "paper_repro_recorder"
  output_dir: "data/results/backtest_v2_results"
  output_metrics_file: "paper_repro_metrics.json"
  model_save_dir: "data/models"

######################################################################
# 1. Factor source — combined (mined + Alpha158(20))
######################################################################

factor_source:
  type: "combined"

  custom:
    json_files: []
    quality_filter: null
    max_factors: null
    use_llm_for_incompatible: false

  combined:
    official_source: "alpha158_20"
    include_custom: true

######################################################################
# 2. Data — CSI 300
######################################################################

data:
  provider_uri: "~/.qlib/qlib_data/cn_data"
  region: "cn"
  market: "csi300"
  start_time: "2016-01-01"
  end_time:   "2025-12-31"

######################################################################
# 3. Dataset — paper-exact label and preprocessing
######################################################################

dataset:
  # Paper label: next-day return y_t = P^close_{t+2} / P^close_{t+1} - 1
  label: "Ref($close, -2) / Ref($close, -1) - 1"

  learn_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "DropnaLabel"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "label"

  infer_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "label"

  segments:
    train: ["2016-01-01", "2020-12-31"]
    valid: ["2021-01-01", "2021-12-31"]
    test:  ["2022-01-01", "2025-12-31"]

######################################################################
# 4. Model — LightGBM (Qlib defaults, paper doesn't specify params)
######################################################################

model:
  type: "lgb"
  extended_training: true
  params:
    loss: "mse"
    colsample_bytree: 0.8879
    learning_rate: 0.0421
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    max_depth: 8
    num_leaves: 210
    num_threads: 20
    seed: 42
    random_state: 42
    early_stopping_round: 50
    num_boost_round: 1000

######################################################################
# 5. Backtest — paper-exact strategy (Table 7)
######################################################################

backtest:
  strategy:
    class: "TopkDropoutStrategy"
    module_path: "qlib.contrib.strategy"
    kwargs:
      signal: "<PRED>"
      topk: 50
      n_drop: 5
    rebalance_freq: 1

  backtest:
    start_time: "2022-01-01"
    end_time:   "2025-12-31"
    account: 100000000
    benchmark: "SH000300"
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: "open"
      open_cost:  0.0005     # 0.05% buying fee
      close_cost: 0.0015     # 0.15% selling fee (commission + stamp duty)
      min_cost: 5

######################################################################
# 6. LLM (for custom factor computation)
######################################################################

max_memory_gb: 40

llm:
  enabled: false
  timeout: 300
  max_retries: 3
  cache_results: true
  cache_dir: "data/results/factor_cache"
  auto_extract_cache: false
  debug: false

######################################################################
# 7. Factor calculation
######################################################################

factor_calculation:
  output_dir: "data/results/computed_factors"
  save_intermediate: true
  n_jobs: 4
